<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Un vent de changement arrive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .click-zone {
      position: absolute;
      /* 
        Ton image fait environ 600px de large
        Le bouton "Je relève le défi" commence à environ 72% 
        de la hauteur totale de l'image et fait environ 15% de hauteur
      */
      top: 72%;
      left: 5%;
      width: 90%;
      height: 15%;
      display: block;
      text-decoration: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      /* Décommente pour voir la zone - à remettre en commentaire après */
      /* border: 3px solid lime; */
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <img 
      src="affiche.png" 
      alt="Un vent de changement arrive"
      id="affiche"
    >
    <a class="click-zone" id="btn" href="stay-tuned.html"></a>
  </div>

  <script>
    // Ce script ajuste automatiquement la zone cliquable
    // selon la taille réelle de l'image affichée à l'écran
    const img = document.getElementById('affiche');
    const btn = document.getElementById('btn');

    function adjustZone() {
      const rect = img.getBoundingClientRect();
      const wrapper = img.parentElement.getBoundingClientRect();

      // Position du bouton dans l'image originale
      // "Je relève le défi" est à environ 72% du haut
      const topRatio = 0.72;
      const heightRatio = 0.14;
      const leftRatio = 0.05;
      const widthRatio = 0.90;

      const imgTop = rect.top - wrapper.top;
      const imgLeft = rect.left - wrapper.left;

      btn.style.top = (imgTop + rect.height * topRatio) + 'px';
      btn.style.left = (imgLeft + rect.width * leftRatio) + 'px';
      btn.style.width = (rect.width * widthRatio) + 'px';
      btn.style.height = (rect.height * heightRatio) + 'px';
    }

    img.onload = adjustZone;
    window.onresize = adjustZone;

    if (img.complete) adjustZone();
  </script>
</body>
</html>
