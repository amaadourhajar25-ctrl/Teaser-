<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Un vent de changement arrive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      position: relative;
      display: inline-block;
      max-width: 100vw;
      max-height: 100vh;
    }

    .wrapper img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .click-zone {
      position: absolute;
      left: 5%;
      bottom: 20%;
      width: 90%;
      height: 15%;
      display: block;
      text-decoration: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <img src="affiche.png" alt="Un vent de changement arrive">
    <a class="click-zone" href="stay-tuned.html"></a>
  </div>
</body>
</html>
