<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Un vent de changement arrive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url('affiche.png') no-repeat center top;
      background-size: contain;
      background-color: black;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .page {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .page img {
      width: 100%;
      height: auto;
      display: block;
    }

    .btn-defi {
      display: block;
      width: 100%;
      padding: 25px;
      text-align: center;
      font-size: 1.8rem;
      color: white;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.45);
      border-top: 1px solid rgba(255,255,255,0.4);
      font-family: Arial, sans-serif;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-defi:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="page">
    <img src="affiche.png" alt="Un vent de changement arrive">
    <a class="btn-defi" href="stay-tuned.html">Je relève le défi !</a>
  </div>
</body>
</html>
