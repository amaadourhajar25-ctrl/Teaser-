<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay tuned</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1f3b2d, #4d7c57);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
    }

    .box {
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.8rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Stay tuned</h1>
    <p>Révélation à partir du 16 juin</p>
  </div>
</body>
</html>
